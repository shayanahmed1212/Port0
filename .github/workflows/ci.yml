# Stack-agnostic CI. Create scripts/test.sh that installs dependencies and runs your tests.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests
        run: |
          if [ ! -f scripts/test.sh ]; then
            echo "scripts/test.sh not found. Create it to run your tests."
            exit 1
          fi
          bash scripts/test.sh
